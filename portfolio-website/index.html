<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Justin Edwards | Software Developer Portfolio</title>

    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored === "dark" || (stored !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>

    <!-- Tailwind (CDN) + semantic colors via CSS variables -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: (function () {
              var cv = function (name) {
                return "rgb(var(--color-" + name + ") / <alpha-value>)";
              };
              return {
                primary: cv("primary"),
                "primary-container": cv("primary-container"),
                "on-primary-container": cv("on-primary-container"),
                "on-primary": cv("on-primary"),
                secondary: cv("secondary"),
                tertiary: cv("tertiary"),
                "tertiary-container": cv("tertiary-container"),
                background: cv("background"),
                surface: cv("surface"),
                "surface-bright": cv("surface-bright"),
                "surface-dim": cv("surface-dim"),
                "surface-container-low": cv("surface-container-low"),
                "surface-container": cv("surface-container"),
                "surface-container-high": cv("surface-container-high"),
                "surface-container-lowest": cv("surface-container-lowest"),
                "on-surface": cv("on-surface"),
                "on-surface-variant": cv("on-surface-variant"),
                outline: cv("outline"),
                "outline-variant": cv("outline-variant"),
                "inverse-surface": cv("inverse-surface"),
                "inverse-on-surface": cv("inverse-on-surface"),
              };
            })(),
            fontFamily: {
              headline: ["Space Grotesk"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
          },
        },
      };
    </script>

    <!-- Fonts + Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome (icons) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="bg-surface text-on-surface selection:bg-primary/20 selection:text-primary dark:selection:bg-primary-container dark:selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
